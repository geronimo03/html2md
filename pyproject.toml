[project]
name = "html2md"
version = "0.1.0"
description = "Convert HTML files to clean, compact Markdown."
readme = "README.md"
authors = [
    { name = "geronimo03", email = "christiefan03@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pyhtml2md>=1.8.0",
]

[project.scripts]
html2md = "html2md.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
